<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>25:00</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a2a2a">
<meta property="og:title" content="Focus">
<meta property="og:image" content="og-image.png">
<style>
:root{--idle:#2a2a2a;--focus:#16305c;--break:#6f6f6f;--fg:#f2f2f2;--dim:rgba(255,255,255,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--idle);transition:background .6s;scroll-padding-top:env(safe-area-inset-top,0px)}
html[data-s=focus]{background:var(--focus)}
html[data-s=break]{background:var(--break)}
html{--ov:rgba(24,24,24,.55)}
html[data-s=focus]{--ov:rgba(12,34,80,.15)}
html[data-s=break]{--ov:rgba(95,95,95,.5)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url(space.webp) center/cover no-repeat}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:var(--ov);transition:background .6s}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:transparent;color:var(--fg);font-family:-apple-system,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{flex:1;box-sizing:border-box;padding:max(40px,14vh) 16px 40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:24px;user-select:none}
#mode{font-size:13px;letter-spacing:.2em;color:var(--dim)}
#time{font-size:min(22vw,120px);font-weight:200;font-variant-numeric:tabular-nums;cursor:pointer;line-height:1}
.row{display:flex;gap:18px;font-size:13px;color:var(--dim);flex-wrap:wrap;justify-content:center}
button{all:unset;cursor:pointer;color:var(--dim);transition:color .2s}
button:hover,button.on{color:var(--fg)}
input[type=text]{background:transparent;border:0;border-bottom:1px solid var(--dim);color:var(--fg);text-align:center;font:inherit;font-size:15px;padding:4px;width:180px;outline:0;user-select:text;border-radius:0}
input::placeholder{color:var(--dim)}
input[type=range]{width:120px;accent-color:#fff;opacity:.6}
#log{width:min(300px,86vw);font-size:13px;color:var(--dim)}
#log>div{display:flex;gap:14px;align-items:center;padding:4px 0}
#log .nm{min-width:56px;text-align:right}
#log .ds{display:flex;gap:7px;flex-wrap:wrap}
.d{flex:0 0 10px;width:10px;height:10px;box-sizing:border-box;border-radius:50%;background:var(--fg);display:block}
.d.o{background:transparent;border:1.5px solid var(--fg)}
#log .tot{justify-content:center;font-size:12px;margin-top:6px;cursor:pointer}
.tot span{padding:4px 12px;border-radius:999px}
.tot .t2{display:none;background:rgba(255,255,255,.18);color:var(--fg)}
.tot .cf{background:#b8453a;color:#fff}
@media (hover:hover){.tot:hover .t1{display:none}.tot:hover .t2{display:inline}}
iframe{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:0;top:0}
</style>
</head>
<body>
<main>
  <div id="mode">FOCUS</div>
  <div id="time" title="클릭: 시작/일시정지">25:00</div>
  <input type="text" id="task" placeholder="집중" maxlength="20">
  <div class="row"><button id="skip">skip</button><button data-len="25">25 / 5</button><button data-len="50">50 / 10</button></div>
  <input type="range" id="vol" min="0" max="100" value="100">
  <div id="log"></div>
</main>
<div id="yt"></div>
<script>
const TEST=true; /* 테스트: 집중/휴식 25초. 배포 전 false로 */
const $=s=>document.querySelector(s),root=document.documentElement;
let pref={len:25};
try{Object.assign(pref,JSON.parse(localStorage.getItem('focus-pref')||'{}'))}catch(e){}
const savePref=()=>{try{localStorage.setItem('focus-pref',JSON.stringify(pref))}catch(e){}};
const dur=m=>TEST?25:(m==='focus'?pref.len*60:(pref.len===50?10:5)*60);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fmtM=m=>m>=60?Math.floor(m/60)+'시간 '+(m%60)+'분':m+'분';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- 기록: 하나로 계속 쌓고, 리셋하면 보관함으로 ---- */
const LK='focus-log2',SK='focus-sessions';
function getLog(){try{return JSON.parse(localStorage.getItem(LK)||'{}')}catch(e){return{}}}
function setLog(L){try{localStorage.setItem(LK,JSON.stringify(L))}catch(e){}}
function addLog(name,min){const L=getLog(),r=L[name]||{n:0,m:0};r.n++;r.m+=min;L[name]=r;setLog(L);
  try{const A=JSON.parse(localStorage.getItem(SK)||'[]');A.push({t:Date.now(),k:name,m:min});localStorage.setItem(SK,JSON.stringify(A))}catch(e){}}
let confirmReset=false,confirmTimer=null;
function renderLog(){
  const L=getLog(),name=$('#task').value.trim()||'집중';
  const rows=Object.entries(L).map(([k,v])=>({k,n:v.n,m:v.m,p:false}));
  if(lastIp){const r=rows.find(x=>x.k===name);r?r.p=true:rows.push({k:name,n:0,m:0,p:true})}
  let t=0;
  $('#log').innerHTML=rows.map(r=>{t+=r.m;return `<div><span class="nm">${esc(r.k)}</span><span class="ds" title="${r.m}분">${'<i class="d"></i>'.repeat(r.n)}${r.p?'<i class="d o"></i>':''}</span></div>`}).join('')
   +(t?`<div class="tot" id="tot">${confirmReset?'<span class="cf">한 번 더 누르면 리셋</span>':`<span class="t1">${fmtM(t)}</span><span class="t2">기록 리셋</span>`}</div>`:'');
}
$('#log').addEventListener('click',e=>{
  if(!e.target.closest('#tot'))return;
  if(!confirmReset){confirmReset=true;renderLog();clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{confirmReset=false;renderLog()},3000);return}
  setLog({});confirmReset=false;clearTimeout(confirmTimer);renderLog();
});

/* ---- 타이머: 누르기 전까지 집중-휴식 계속 반복 ---- */
let mode='focus',left=dur('focus'),timer=null,end=0,ctx=null,flash=null,lastIp=false;
function paint(){
  const t=fmt(left);$('#time').textContent=t;if(!flash)document.title=t;
  $('#mode').textContent=mode==='focus'?'FOCUS':'BREAK';
  root.dataset.s=timer?mode:'idle';
  const ip=mode==='focus'&&(!!timer||left<dur('focus'));if(ip!==lastIp){lastIp=ip;renderLog()}
  document.querySelectorAll('[data-len]').forEach(b=>b.classList.toggle('on',+b.dataset.len===pref.len));
}
function bell(){
  if(!ctx)return;ctx.resume&&ctx.resume();
  [[880,0],[1175,.35],[1568,.7],[1175,1.4],[1568,1.75],[2093,2.1]].forEach(([f,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+d;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.3);
  });
}
function flashTitle(msg){
  clearInterval(flash);let i=0;
  flash=setInterval(()=>{document.title=i++%2?fmt(left):msg;if(i>16){clearInterval(flash);flash=null;paint()}},500);
}
function finish(){
  stop();
  const wasFocus=mode==='focus';
  if(wasFocus){addLog($('#task').value.trim()||'집중',pref.len);renderLog()}
  bell();
  const msg=wasFocus?'⏰ 휴식!':'⏰ 집중!';
  try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification(msg)}catch(e){}
  mode=wasFocus?'break':'focus';left=dur(mode);
  start();flashTitle(msg);
}
function tick(){left=Math.max(0,Math.round((end-Date.now())/1000));paint();if(left<=0)finish()}
function start(){
  if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  ctx&&ctx.resume&&ctx.resume();
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  startSound();clearInterval(timer);end=Date.now()+left*1000;timer=setInterval(tick,250);paint();
}
function stop(){clearInterval(timer);timer=null;paint()}
$('#time').onclick=()=>{clearInterval(flash);flash=null;timer?(stop(),stopSound()):start()};
$('#skip').onclick=()=>{const was=!!timer;stop();mode=mode==='focus'?'break':'focus';left=dur(mode);paint();if(was)start()};
document.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{pref.len=+b.dataset.len;savePref();stop();stopSound();left=dur(mode);paint()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();$('#time').click()}});
$('#task').addEventListener('input',renderLog);

/* ---- COSMOS: 타이머가 돌아가는 동안 자동 재생 ---- */
let ytTouched=false;
function setYtVol(){const f=document.querySelector('iframe');if(f)f.contentWindow.postMessage(JSON.stringify({event:'command',func:'setVolume',args:[+$('#vol').value]}),'*')}
function startSound(){
  if($('#yt').firstChild)return;
  const f=document.createElement('iframe');f.allow='autoplay;encrypted-media';
  f.src='https://www.youtube.com/embed/xRuHxlUoy2s?autoplay=1&enablejsapi=1&playsinline=1';
  if(ytTouched)f.onload=()=>setTimeout(setYtVol,1500);
  $('#yt').appendChild(f);
}
function stopSound(){$('#yt').innerHTML=''}
$('#vol').oninput=()=>{ytTouched=true;setYtVol()};

paint();renderLog();
</script>
</body>
</html>
