<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>월간 리포트 beta</title>
<style>
:root{--bg:#2a2a2a;--fg:#f2f2f2;--dim:rgba(255,255,255,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:transparent;color:var(--fg);font-family:-apple-system,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{flex:1;width:min(420px,90vw);margin:0 auto;padding:max(32px,8vh) 0 40px;display:flex;flex-direction:column;gap:26px}
h1{margin:0;font-size:13px;font-weight:400;letter-spacing:.2em;color:var(--dim);text-align:center}
h1 sup{font-size:9px}
button,select{all:unset;cursor:pointer;color:var(--dim);transition:color .2s}
button:hover{color:var(--fg)}
.nav{display:flex;justify-content:center;align-items:center;gap:22px;font-size:18px}
#ym{font-size:18px;font-weight:300;min-width:130px;text-align:center;color:var(--fg)}
.sum{display:flex;justify-content:space-around;text-align:center}
.sum b{display:block;font-size:26px;font-weight:200}
.sum span{font-size:11px;color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:4px;font-style:normal;font-size:10px;color:rgba(255,255,255,.55);display:flex;align-items:flex-start;padding:3px 4px;box-sizing:border-box}
.cal .h{aspect-ratio:auto;background:none;color:var(--dim);justify-content:center;padding:0}
.cal .t{outline:1px solid var(--fg)}
.tasks{display:flex;flex-direction:column;gap:12px;font-size:13px}
.tasks div{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;color:var(--dim)}
.tasks .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
.tasks .bar u{display:block;height:100%;border-radius:2px;background:var(--fg);opacity:.7}
.tasks span:last-child{text-align:right}
.empty{text-align:center;color:var(--dim);font-size:13px}
.opt{text-align:center;font-size:11px}
footer{border-top:1px solid rgba(255,255,255,.12);padding:14px 16px;display:flex;gap:22px;justify-content:center;font-size:12px}
footer a{color:var(--dim);text-decoration:none}
footer a:hover,footer a.cur{color:var(--fg)}
footer sup{font-size:9px}
</style>
</head>
<body>
<main>
  <h1>MONTHLY <sup>beta</sup></h1>
  <div class="nav"><button id="prev">‹</button><div id="ym"></div><button id="next">›</button></div>
  <div class="sum" id="sum"></div>
  <div class="cal" id="cal"></div>
  <div class="tasks" id="tasks"></div>
  <div class="opt"><select id="cut"></select></div>
</main>
<footer><a href="./">타이머</a><a class="cur" href="report.html">월간 리포트 <sup>beta</sup></a></footer>
<script>
const $=s=>document.querySelector(s);
let S=[];try{S=JSON.parse(localStorage.getItem('focus-sessions')||'[]')}catch(e){}
let cut=0;try{cut=+localStorage.getItem('focus-cut')||0}catch(e){}
const now=new Date();let cur=new Date(now.getFullYear(),now.getMonth(),1);
const fmtM=m=>m>=60?Math.floor(m/60)+'시간 '+(m%60?(m%60)+'분':''):m+'분';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dOf=t=>new Date(t-cut*36e5);
function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  $('#ym').textContent=y+'년 '+(m+1)+'월';
  const ms=S.filter(x=>{const d=dOf(x.t);return d.getFullYear()===y&&d.getMonth()===m});
  const day={},task={};let tot=0;
  ms.forEach(x=>{const d=dOf(x.t).getDate();day[d]=(day[d]||0)+x.m;task[x.k]=(task[x.k]||0)+x.m;tot+=x.m});
  $('#sum').innerHTML=`<div><b>${fmtM(tot)||'0분'}</b><span>총 시간</span></div><div><b>${ms.length}</b><span>타임</span></div><div><b>${Object.keys(day).length}</b><span>작업한 날</span></div>`;
  const max=Math.max(1,...Object.values(day)),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  const td=dOf(Date.now()),isNow=td.getFullYear()===y&&td.getMonth()===m;
  let h=['일','월','화','수','목','금','토'].map(d=>`<i class="h">${d}</i>`).join('')+'<i class="h"></i>'.repeat(first);
  for(let d=1;d<=n;d++){const v=day[d]||0;h+=`<i class="${isNow&&td.getDate()===d?'t':''}" style="background:rgba(255,255,255,${v?(.18+.62*v/max).toFixed(2):.06})" title="${m+1}/${d} · ${v?fmtM(v):'기록 없음'}">${d}</i>`}
  $('#cal').innerHTML=h;
  const rows=Object.entries(task).sort((a,b)=>b[1]-a[1]);
  $('#tasks').innerHTML=rows.length?rows.map(([k,v])=>`<div><span>${esc(k)}</span><span class="bar"><u style="width:${Math.round(100*v/rows[0][1])}%"></u></span><span>${fmtM(v)}</span></div>`).join(''):'<div class="empty" style="display:block">이 달의 기록이 없어요</div>';
}
$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$('#cut').innerHTML=[0,3,4,5,6].map(h=>`<option value="${h}"${h===cut?' selected':''}>${h===0?'하루 기준: 자정':'하루 기준: 새벽 '+h+'시'}</option>`).join('');
$('#cut').onchange=e=>{cut=+e.target.value;try{localStorage.setItem('focus-cut',cut)}catch(x){}render()};
render();
</script>
</body>
</html>
